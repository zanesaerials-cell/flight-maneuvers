  <path d="M 694 592 L 924 536 Q 958 530 958 554 Q 958 578 924 582 L 694 648 Z" fill="url(#wingR)"/>
  <circle cx="80" cy="558" r="13" fill="#33d17a"/>
  <circle cx="944" cy="558" r="13" fill="#ff4b4b"/>

  <!-- Rear legs (further away, a shade darker) -->
